name: Update product data

# Builds the barcode -> product table from the Israeli supermarket price lists
# and publishes it to the "data" branch, which the app reads. Free for public repos.
on:
  schedule:
    - cron: '23 2 * * *'     # every day, 04:23 Israel time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_products.py'
      - '.github/workflows/products.yml'

permissions:
  contents: write

concurrency:
  group: products
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install il-supermarket-scraper lxml requests
      - name: Download price lists and build the table
        run: python scripts/build_products.py
      - name: Publish to the data branch
        run: |
          cd out
          git init -q
          git checkout -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Product data $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
