<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barcode Wallet</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3efe7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script defer src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
  :root{
    --bg:#f3efe7; --card:#fffdf9; --ink:#1a1814; --muted:#7a7468; --line:#e4ddd0;
    --accent:#ff5b1f; --accent-ink:#fff; --danger:#c8321e; --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body.lock{overflow:hidden}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:22px 18px 60px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
  h1{font:700 34px/1 "Space Grotesk",sans-serif;letter-spacing:-.02em;margin:0}
  h1 span{color:var(--accent)}
  .pill{font-size:12px;font-weight:500;color:var(--muted);background:#ebe5d9;border-radius:99px;padding:5px 10px;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .pill i{width:7px;height:7px;border-radius:50%;background:#bbb;display:inline-block}
  .pill.cloud i{background:#2fa36b}.pill.local i{background:#e0a020}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .toggle{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:28px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .toggle input{position:absolute;opacity:0;pointer-events:none}
  .sw{width:46px;height:28px;border-radius:99px;background:#ddd5c6;position:relative;flex:none;transition:background .15s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
  .toggle input:checked + .sw{background:var(--accent)}
  .toggle input:checked + .sw::after{transform:translateX(18px)}
  .toggle input:focus-visible + .sw{outline:2px solid var(--accent);outline-offset:2px}
  .tl b{display:block;font-weight:600}
  .tl small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
  .tick{width:56px;height:56px;border-radius:50%;background:#2fa36b;color:#fff;display:grid;place-items:center;margin:0 auto 12px;font-size:30px;animation:pop .25s ease-out}
  .center{text-align:center}
  .count{font:500 13px Inter;color:var(--muted);text-align:center;margin:-4px 0 14px}
  @keyframes pop{from{transform:scale(.4);opacity:0}}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 16px;font-weight:600;background:#e9e2d4;text-decoration:none;text-align:center;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .08s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.big{grid-column:1/-1;padding:22px;font-size:18px;border-radius:var(--radius);box-shadow:0 8px 24px -10px rgba(255,91,31,.6)}
  .btn.ghost{background:transparent;border:1.5px solid var(--line)}
  .btn.danger{background:transparent;color:var(--danger);border:1.5px solid #efc9c1}
  .btn svg{width:22px;height:22px;flex:none}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .section-title{font:600 13px/1 Inter;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px 4px}
  #list,.stack{display:flex;flex-direction:column;gap:10px}
  #home[hidden]{display:none}
  #foldersWrap{margin-bottom:26px}
  .keep-note{font-size:13px;color:var(--muted);margin:10px 4px 0}
  .folder-ic{width:52px;height:52px;flex:none;border-radius:14px;background:#ffe3d6;color:var(--accent);display:grid;place-items:center}
  .folder-ic svg{width:26px;height:26px}
  .count-badge{font:600 13px Inter;color:var(--muted);background:#efe8db;border-radius:99px;padding:3px 9px;white-space:nowrap}
  #folderView{min-height:100vh;background:var(--bg)}
  #folderView[hidden]{display:none}
  .back{padding:0;margin:0 0 14px;font-size:16px}
  .fv-title{font:700 26px/1.15 "Space Grotesk";margin:0 0 4px}
  .fv-sub{color:var(--muted);margin:0 0 18px}
  .fv-del{width:100%;margin-top:26px}
  .card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 12px 12px;-webkit-tap-highlight-color:transparent}
  .card:active{background:#f7f2e9}
  .thumb{width:88px;height:52px;flex:none;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px}
  .thumb svg{height:100%;width:auto;max-width:100%}
  .thumb img{width:calc(100% + 8px);height:calc(100% + 8px);object-fit:cover}
  .thumb .nocode{font-size:10px;color:var(--muted);overflow:hidden}
  .meta{flex:1;min-width:0}
  .meta .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .val{font:500 13px/1.3 "JetBrains Mono",monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .chev{color:#c4bcad;font-size:24px;line-height:1}
  #empty{text-align:center;color:var(--muted);padding:34px 20px;border:1.5px dashed var(--line);border-radius:var(--radius)}
  #empty b{display:block;color:var(--ink);font:600 17px "Space Grotesk";margin-bottom:4px}

  /* Show overlay */
  #show{position:fixed;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column;overflow:auto}
  #show[hidden]{display:none}
  .show-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
  .show-top .fmt{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .link{background:none;border:0;color:var(--accent);font-weight:600;font-size:17px;padding:6px 4px}
  .show-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:10px 16px 20px;text-align:center}
  .name-input{border:0;border-bottom:1.5px dashed transparent;background:none;text-align:center;font:700 26px/1.2 "Space Grotesk";width:100%;max-width:480px;padding:4px;outline:none}
  .name-input:focus{border-bottom-color:var(--line)}
  .code-big{display:flex;align-items:center;justify-content:center;background:#fff;padding:8px}
  .code-big.bar svg{width:min(94vw,600px);height:auto}
  .code-big.qr svg{width:min(80vw,360px);height:auto}
  .code-big.img img{max-width:92vw;max-height:56vh;border-radius:12px}
  .code-big .nocode{font:500 20px "JetBrains Mono",monospace;word-break:break-all}
  .mono{font:500 18px/1.3 "JetBrains Mono",monospace;letter-spacing:.06em;word-break:break-all}
  .hint{font-size:13px;color:var(--muted);margin:0}
  .show-actions{display:flex;gap:8px;padding:14px 16px 22px;justify-content:center;flex-wrap:wrap}
  .show-actions .btn{padding:11px 14px;font-size:14px}

  /* Sheet */
  #backdrop{position:fixed;inset:0;background:rgba(20,16,10,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
  #backdrop[hidden]{display:none}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px 26px;max-height:92vh;overflow:auto;animation:up .2s ease-out}
  @media (min-width:600px){#backdrop{align-items:center}.sheet{border-radius:24px}}
  .sheet h2{font:700 22px/1.2 "Space Grotesk";margin:0 0 14px}
  .sheet p{margin:0 0 14px;color:var(--muted)}
  .preview{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;justify-content:center;margin-bottom:8px}
  .preview svg{max-width:100%;height:auto;max-height:180px}
  .preview img{max-width:100%;max-height:220px;border-radius:8px}
  .preview .nocode{font-family:"JetBrains Mono",monospace}
  .small{font-size:14px;text-align:center;color:var(--muted);margin-bottom:14px}
  .warn{background:#fff4dc;color:#7a5600 !important;border-radius:10px;padding:8px 12px;font-size:14px}
  .field{display:block;margin-bottom:14px}
  .field span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px 2px}
  .field input,.field select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none;font-size:16px}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .col{display:flex;flex-direction:column;gap:10px}
  .fail-img{display:block;max-width:100%;max-height:200px;margin:0 auto 14px;border-radius:12px}
  .working{text-align:center;padding:20px 0 8px}
  .spinner{width:38px;height:38px;border:4px solid #eadfcf;border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}

  #scan{position:fixed;inset:0;background:#000;z-index:25;overflow:hidden}
  #scan[hidden]{display:none}
  #vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .reticle{position:absolute;left:50%;top:46%;width:min(82vw,440px);height:min(42vh,260px);transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 0 0 100vmax rgba(0,0,0,.38);transition:border-color .15s}
  .reticle i{position:absolute;left:8%;right:8%;height:2px;background:var(--accent);top:50%;box-shadow:0 0 12px var(--accent);animation:laser 1.6s ease-in-out infinite alternate}
  .reticle.ok{border-color:#2fd88a}.reticle.ok i{background:#2fd88a;box-shadow:0 0 14px #2fd88a}
  .reticle.dup{border-color:#ffc23d}
  .scan-top{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:14px}
  .grow{flex:1}
  .chip{background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:99px;padding:9px 14px;font-weight:600;font-size:14px;backdrop-filter:blur(6px)}
  .chip.strong{background:#fff;color:#000}
  .chip.on{background:#ffd23d;color:#000}
  .scan-msg{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:12px 18px;border-radius:14px;font-weight:500;max-width:90vw;text-align:center;backdrop-filter:blur(6px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes laser{from{top:18%}to{top:82%}}
  .reel-btn{grid-column:1/-1;background:var(--ink);color:#fff}
  #reel{position:fixed;inset:0;background:#fff;z-index:22;display:flex;flex-direction:column}
  #reel[hidden]{display:none}
  .reel-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0}
  .reel-stage .slide{display:none}
  .reel-stage .slide.on{display:flex}
  .reel-stage .slide.blank{width:100%;height:100%;background:#fff}
  .reel-name{text-align:center;font:600 16px "Space Grotesk";color:var(--muted);min-height:22px;padding:0 16px}
  #reelPrev,#reelNext{font-size:22px;padding:8px 20px}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:90vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fade{from{opacity:0}}
  @keyframes up{from{transform:translateY(30px);opacity:.5}}
</style>
</head>
<body>
<div class="wrap" id="home">
  <header>
    <h1>Barcode<br>Wallet<span>.</span></h1>
    <div id="mode" class="pill"><i></i><span>Connecting…</span></div>
  </header>

  <div class="actions">
    <button type="button" class="btn primary big" id="camBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>
      Start scanning
    </button>
    <button type="button" class="btn" id="picBtn">Choose photos</button>
    <button class="btn" id="typeBtn" type="button">Type a number</button>
    <button class="btn reel-btn" id="reelBtn" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg>Reel mode</button>
  </div>
  <label class="toggle">
    <input type="checkbox" id="rowMode">
    <span class="sw"></span>
    <span class="tl"><b>Open camera on start</b><small>The scanner opens as soon as you open the app and saves every new code it sees.</small></span>
  </label>
  <input class="vh" id="camIn" type="file" accept="image/*">
  <input class="vh" id="picIn" type="file" accept="image/*" multiple>

  <div id="empty"><b>Nothing saved yet</b>Scan a loyalty card, ticket or coupon and it'll live here, ready to show.</div>
  <div id="foldersWrap" hidden><p class="section-title">Scans</p><div id="folders" class="stack"></div><p class="keep-note">Scans are deleted automatically after 7 days.</p></div>
  <div id="looseWrap" hidden><p class="section-title">Other saved codes</p><div id="list" class="stack"></div></div>
</div>

<div id="folderView" hidden>
  <div class="wrap">
    <button class="link back" id="fvBack" type="button">‹ All scans</button>
    <h2 class="fv-title" id="fvTitle"></h2>
    <p class="fv-sub" id="fvSub"></p>
    <div class="actions">
      <button class="btn reel-btn" id="fvReel" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg>Reel mode</button>
    </div>
    <div id="fvList" class="stack"></div>
    <button class="btn danger fv-del" id="fvDelete" type="button">Delete this folder</button>
  </div>
</div>

<div id="scan" hidden>
  <video id="vid" playsinline muted autoplay></video>
  <div class="reticle" id="reticle"><i></i></div>
  <div class="scan-top">
    <span id="scanCount" class="chip">0 saved</span>
    <span class="grow"></span>
    <button id="soundBtn" class="chip on" type="button" hidden>🔇 Tap for sound</button>
    <button id="torchBtn" class="chip" type="button" hidden>Light</button>
    <button id="scanDone" class="chip strong" type="button">Done</button>
  </div>
  <div id="scanMsg" class="scan-msg" dir="auto">Point at a barcode</div>
</div>

<div id="reel" hidden>
  <div class="show-top">
    <span class="fmt" id="reelCount"></span>
    <button class="link" id="reelDone" type="button">Done</button>
  </div>
  <div id="reelStage" class="reel-stage"></div>
  <div id="reelName" class="reel-name" dir="auto"></div>
  <div class="show-actions">
    <button class="btn ghost" id="reelPrev" type="button" aria-label="Previous">‹</button>
    <button class="btn ghost" id="reelPause" type="button">Pause</button>
    <button class="btn ghost" id="reelNext" type="button" aria-label="Next">›</button>
  </div>
</div>

<div id="show" hidden>
  <div class="show-top">
    <span class="fmt" id="showFmt"></span>
    <button class="link" id="showClose" type="button">Done</button>
  </div>
  <div class="show-body">
    <input id="showName" class="name-input" dir="auto" placeholder="Add a name" maxlength="60" aria-label="Name">
    <div id="showCode" class="code-big"></div>
    <div id="showVal" class="mono" dir="auto"></div>
    <p class="hint">Turn your screen brightness up for the scanner.</p>
  </div>
  <div class="show-actions">
    <button class="btn ghost" id="showPhoto" type="button">Original photo</button>
    <button class="btn ghost" id="showCopy" type="button">Copy number</button>
    <button class="btn danger" id="showDel" type="button">Delete</button>
  </div>
</div>

<div id="backdrop" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const NS = 'http://www.w3.org/2000/svg';
  const LS = 'barcode-wallet-v1';
  const TWO_D = ['DATA_MATRIX','PDF_417','AZTEC','MAXICODE'];
  const JSB = {EAN_13:'EAN13',EAN_8:'EAN8',UPC_A:'UPC',UPC_E:'UPCE',CODE_128:'CODE128',CODE_39:'CODE39',ITF:'ITF',CODABAR:'codabar'};
  const FMT_NAMES = {QR_CODE:'QR code',EAN_13:'EAN-13',EAN_8:'EAN-8',UPC_A:'UPC-A',UPC_E:'UPC-E',CODE_128:'Code 128',CODE_39:'Code 39',CODE_93:'Code 93',ITF:'ITF',CODABAR:'Codabar',DATA_MATRIX:'Data Matrix',PDF_417:'PDF417',AZTEC:'Aztec',PHOTO:'Photo'};
  const fmtLabel = f => FMT_NAMES[f] || String(f||'').replace(/_/g,' ');

  if (window.qrcode && qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']) {
    qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  }

  let items = [];          // what's displayed
  let col = null;          // cloud collection, when available
  let pending = new Map(); // items saved on this device, not yet in the cloud
  let showId = null, showingPhoto = false;

  /* ---------- storage ---------- */
  function lsGet(){ try { return JSON.parse(localStorage.getItem(LS) || '[]') || []; } catch(e){ return []; } }
  function lsSet(a){ try { localStorage.setItem(LS, JSON.stringify(a)); } catch(e){} }
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const sortItems = a => a.sort((x,y) => (y.created||0) - (x.created||0));
  function bodyOf(it){
    const b = {name: it.name || '', value: it.value || '', format: it.format, created: it.created};
    if (it.photo) b.photo = it.photo;
    if (it.session) b.session = it.session;
    return b;
  }

  function setMode(m){
    const el = $('#mode');
    el.className = 'pill ' + m;
    el.querySelector('span').textContent =
      m === 'cloud' ? 'Synced to your account' :
      m === 'local' ? 'Saved on this phone' :
      m === 'slow'  ? 'Still connecting…' : 'Connecting…';
  }

  function applyLocal(){
    items = sortItems(lsGet());
    items.forEach(i => { if (i._local) pending.set(i.id, i); });
    render();
  }

  async function saveItem(it){
    it.id = it.id || newId();
    it.created = it.created || Date.now();
    if (col) {
      try {
        await col.doc(it.id).set(bodyOf(it));
        pending.delete(it.id);
        return;
      } catch(e){
        toast(e && e.code === 'quota_exceeded' ? 'Storage is full — delete a few to save more' : "Couldn't sync — saved on this device");
      }
    }
    const local = Object.assign({}, bodyOf(it), {id: it.id, _local: true});
    pending.set(it.id, local);
    items = sortItems(items.filter(x => x.id !== it.id).concat(local));
    lsSet(items);
    render();
  }

  async function deleteItem(it){
    pending.delete(it.id);
    items = items.filter(x => x.id !== it.id);
    lsSet(items);
    render();
    if (col && !it._local) {
      try { await col.doc(it.id).delete(); } catch(e){ toast("Couldn't delete from your account"); }
    }
  }

  /* ---------- drawing codes ---------- */
  function kind(it){
    if (it.format === 'PHOTO') return 'img';
    if (it.format === 'QR_CODE') return 'qr';
    if (TWO_D.includes(it.format)) return it.photo ? 'img' : 'qr';
    return 'bar';
  }
  function qrSvg(text){
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    const n = q.getModuleCount(), m = 2, s = n + m*2;
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r,c)) d += 'M' + (c+m) + ',' + (r+m) + 'h1v1h-1z';
    const wrap = document.createElement('div');
    wrap.innerHTML = '<svg xmlns="' + NS + '" viewBox="0 0 ' + s + ' ' + s + '" shape-rendering="crispEdges"><rect width="' + s + '" height="' + s + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
    return wrap.firstChild;
  }
  function barSvg(it, big){
    const tries = [JSB[it.format] || 'CODE128', 'CODE128'];
    for (const f of tries) {
      try {
        const svg = document.createElementNS(NS, 'svg');
        JsBarcode(svg, it.value, {format: f, displayValue: false, margin: big ? 18 : 4, height: big ? 130 : 60, width: 2, background: '#ffffff', lineColor: '#000000'});
        const w = parseFloat(svg.getAttribute('width')), h = parseFloat(svg.getAttribute('height'));
        if (!w || !h) continue;
        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
        svg.removeAttribute('width'); svg.removeAttribute('height');
        svg.removeAttribute('style');

  /* ---------- reel mode ---------- */

        // a silent blip, played inside the tap, is what wakes sound up on iPhones
        const b = audioCtx.createBuffer(1, 1, 22050), src = audioCtx.createBufferSource();
        src.buffer = b; src.connect(audioCtx.destination); src.start(0);
        const r = audioCtx.resume(); if (r && r.then) r.then(updateSoundChip, () => {});
      }
    } catch(e){}
    updateSoundChip();
  }
  // kind: 'ok' = new code saved, 'dup' = already saved
  function beep(kind){
    try {
      if (!soundReady()) return;
      const t = audioCtx.currentTime, dup = kind === 'dup';
      const tones = dup ? [[0, 880], [0.16, 880]] : [[0, 2300]];
      for (const [at, hz] of tones) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'square'; o.frequency.value = hz;
        g.gain.setValueAtTime(0.0001, t + at);
        g.gain.exponentialRampToValueAtTime(0.35, t + at + 0.008);
        g.gain.setValueAtTime(0.35, t + at + 0.09);
        g.gain.exponentialRampToValueAtTime(0.0001, t + at + 0.12);
        o.connect(g).connect(audioCtx.destination); o.start(t + at); o.stop(t + at + 0.13);
      }
    } catch(e){}
  }
  $('#soundBtn').addEventListener('click', e => { e.stopPropagation(); unlockAudio(); beep('ok'); });
  function flash(kind){
    const r = $('#reticle'); r.classList.remove('ok', 'dup'); void r.offsetWidth; r.classList.add(kind);
    setTimeout(() => r.classList.remove(kind), 700);
  }

  async function startScanner(){
    if (scanning) return;
    if (!sessionId) { sessionId = Date.now(); sessionVals = new Map(); lastVal = ''; scanSig = null; cleared = true; clearStart = 0; }
    $('#scan').hidden = false; document.body.classList.add('lock');
    $('#scanCount').textContent = sessionCount + ' saved';
    setMsg('Starting camera…');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camError("This browser can't use the camera. Try opening the page in Chrome or Safari.");
    try {
      stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}}});
    } catch(e){
      return camError(e && e.name === 'NotAllowedError'
        ? 'Camera access is blocked. Allow the camera for this site in your browser settings, then try again.'
        : "Couldn't start the camera. Close other apps using it and try again.");
    }
    const v = $('#vid'); v.srcObject = stream;
    try { await v.play(); } catch(e){}
    setupTorch();
    if (!detector && 'BarcodeDetector' in window) { try { detector = new BarcodeDetector(); } catch(e){ detector = null; } }
    scanning = true; cand = ''; candN = 0;
    setMsg('Point at a barcode');
    updateSoundChip();
    loop();
  }
  function stopTracks(){
    scanning = false; clearTimeout(loopT);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    $('#vid').srcObject = null; torchOn = false;
  }
  function stopScanner(){
    stopTracks();
    $('#scan').hidden = true;
    if ($('#show').hidden && $('#backdrop').hidden) document.body.classList.remove('lock');
    const sid = sessionId, n = sessionCount;
    sessionCount = 0; sessionId = null;
    if (n) {
      const f = getFolder(sid);
      if (f) { openFolderView(sid); toast(plural(n) + ' saved to ' + folderName(f.last)); }
      else toast(plural(n) + ' saved');
    }
  }
  function camError(msg){
    stopTracks(); $('#scan').hidden = true;
    openSheet('<h2>Camera unavailable</h2><p class="m"></p><div class="col"><button type="button" class="btn primary" data-act="retry">Try again</button><button type="button" class="btn" data-act="cam">Take a photo instead</button><button type="button" class="btn ghost" data-act="cancel">Close</button></div>',
      {retry: () => { closeSheet(); startScanner(); }}, el => el.querySelector('.m').textContent = msg);
  }
  function setupTorch(){
    const b = $('#torchBtn'); b.hidden = true; b.classList.remove('on');
    try {
      const track = stream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps && caps.torch) b.hidden = false;
    } catch(e){}
  }
  $('#torchBtn').addEventListener('click', async () => {
    try {
      const track = stream.getVideoTracks()[0];
      torchOn = !torchOn;
      await track.applyConstraints({advanced: [{torch: torchOn}]});
      $('#torchBtn').classList.toggle('on', torchOn);
    } catch(e){ torchOn = false; }
  });
  $('#scanDone').addEventListener('click', stopScanner);

  const frameCanvas = document.createElement('canvas');
  function grabCenter(v){
    const vw = v.videoWidth, vh = v.videoHeight; if (!vw || !vh) return null;
    const cw = Math.round(vw * 0.86), ch = Math.round(vh * 0.6);
    const k = Math.min(1, 960 / cw);
    frameCanvas.width = Math.round(cw * k); frameCanvas.height = Math.round(ch * k);
    const ctx = frameCanvas.getContext('2d', {willReadFrequently: true});
    ctx.drawImage(v, (vw - cw) / 2, (vh - ch) / 2, cw, ch, 0, 0, frameCanvas.width, frameCanvas.height);
    return frameCanvas;
  }
  async function detectFrame(v){
    if (detector) {
      const r = await detector.detect(v);
      return r && r.length && r[0].rawValue ? {value: r[0].rawValue, format: normFmt(r[0].format)} : null;
    }
    const Z = window.ZXing; if (!Z) return null;
    if (!zxReader) {
      zxHints = new Map();
      zxReader = new Z.MultiFormatReader(); zxReader.setHints(zxHints);
    }
    const c = grabCenter(v); if (!c) return null;
    try {
      const r = zxReader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c))), zxHints);
      return r && r.getText() ? {value: r.getText(), format: normFmt(Z.BarcodeFormat[r.getBarcodeFormat()])} : null;
    } catch(e){ return null; }
  }
  async function loop(){
    if (!scanning) return;
    const v = $('#vid');
    if (v.readyState >= 2 && !busy) {
      busy = true;
      try { const r = await detectFrame(v); trackScene(v, r); if (r) onCode(r, v); else candN = 0; } catch(e){}
      busy = false;
    }
    loopT = setTimeout(loop, 60);
  }
  /* "Is the product gone?" — a tiny greyscale picture of the view is kept from the
     moment of each scan. The same barcode only counts again after the whole view has
     changed a lot from that picture (product taken away) and stayed changed for a moment. */
  const SIG_W = 32, SIG_H = 24;
  const SCENE_DIFF = 0.55;   // 0 = identical view, ~1.1 = completely different view
  const CLEAR_MS = 120;      // first-to-last changed check; with checks every ~60ms this means the product was gone ~0.2s
  const sigCanvas = document.createElement('canvas'); sigCanvas.width = SIG_W; sigCanvas.height = SIG_H;
  const sigCtx = sigCanvas.getContext('2d', {willReadFrequently: true});
  function sceneSig(v){
    sigCtx.drawImage(v, 0, 0, SIG_W, SIG_H);
    const d = sigCtx.getImageData(0, 0, SIG_W, SIG_H).data, n = SIG_W * SIG_H, g = new Float32Array(n);
    let sum = 0;
    for (let i = 0; i < n; i++) { g[i] = d[i*4] * 0.3 + d[i*4+1] * 0.59 + d[i*4+2] * 0.11; sum += g[i]; }
    const mean = sum / n; let sq = 0;
    for (let i = 0; i < n; i++) { g[i] -= mean; sq += g[i] * g[i]; }
    const sd = Math.sqrt(sq / n) || 1;
    for (let i = 0; i < n; i++) g[i] /= sd;   // ignores the camera brightening or darkening
    return g;
  }
  function sigDiff(a, b){ let t = 0; for (let i = 0; i < a.length; i++) t += Math.abs(a[i] - b[i]); return t / a.length; }
  function trackScene(v, r){
    if (cleared || !scanSig) return;
    if (r && r.value === lastVal) { clearStart = 0; return; }     // the product is still there
    let d = 0;
    try { d = sigDiff(sceneSig(v), scanSig); } catch(e){ return; }
    if (d < SCENE_DIFF) { clearStart = 0; return; }
    const now = Date.now();
    if (!clearStart) clearStart = now;
    else if (now - clearStart >= CLEAR_MS) { cleared = true; setMsg('Ready for the next item'); }
  }

  function onCode(r, v){
    const now = Date.now();
    // the same product hasn't left the view yet: not a new scan
    if (r.value === lastVal && !cleared) return;
    if (!detector) {           // the fallback reader can misread, so need the same result twice
      if (r.value === cand) candN++; else { cand = r.value; candN = 1; }
      if (candN < 2) return;
    }
    lastVal = r.value; lastSeen = now;
    try { scanSig = sceneSig(v); cleared = false; clearStart = 0; } catch(e){ scanSig = null; cleared = true; }
    const n = (sessionVals.get(r.value) || 0) + 1;
    sessionVals.set(r.value, n);
    let photo = null;
    try { photo = toCanvas(v, 760).toDataURL('image/jpeg', 0.72); } catch(e){}
    const it = {value: r.value, format: r.format, photo: photo, session: sessionId};
    it.name = defaultName(it) + (n > 1 ? ' (' + n + ')' : '');
    saveItem(it);
    sessionCount++;
    $('#scanCount').textContent = sessionCount + ' saved';
    setMsg((n > 1 ? 'Saved again ×' + n + ' · ' : 'Saved ' + fmtLabel(r.format) + ' · ') + r.value);
    flash('ok'); beep('ok');
    try { if (navigator.vibrate) navigator.vibrate(70); } catch(e){}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && scanning) { resumeLater = true; stopTracks(); }
    else if (!document.hidden && resumeLater) { resumeLater = false; startScanner(); }
  });
  for (const ev of ['pointerdown', 'touchend', 'click', 'keydown']) document.addEventListener(ev, () => { if (!soundReady()) unlockAudio(); }, {passive: true, capture: true});
  $('#picBtn').addEventListener('click', () => { try { $('#picIn').click(); } catch(e){} });

  /* ---------- toast ---------- */
  let tt;
  function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }

  applyLocal();
  setMode('local');

  /* ---------- auto-delete scan folders older than a week ---------- */
  const KEEP_MS = 7 * 24 * 60 * 60 * 1000;
  function purgeOld(){
    const cutoff = Date.now() - KEEP_MS;
    const old = folders().filter(f => f.last < cutoff);   // judged by the folder's last scan
    if (!old.length) return;
    const gone = new Set();
    old.forEach(f => f.items.forEach(it => { gone.add(it.id); pending.delete(it.id); }));
    items = items.filter(it => !gone.has(it.id));
    lsSet(items);
    if (openFolder !== null && !getFolder(openFolder)) closeFolderView();
    render();
  }
  purgeOld();
  setInterval(purgeOld, 60 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) purgeOld(); });
  if (rowEl.checked) startScanner();
})();
</script>
</body>
</html>
